<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    :root {
      --bg: #12141a;
      --card: #1a1d25;
      --line: #262a35;
      --text: #edeff3;
      --muted: #8b93a3;
      --accent: #5b8cff;
      --ok: #3ddc97;
      --warn: #ffb45a;
      --err: #ff6b5e;
    }
    * { box-sizing: border-box; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      font-size: 12px;
      color: var(--text);
      background: var(--bg);
      margin: 0;
      padding: 14px;
      line-height: 1.4;
    }

    /* header */
    .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .title { font-size: 13px; font-weight: 600; letter-spacing: 0.2px; }
    .pill {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 11px; font-weight: 600; padding: 4px 9px; border-radius: 999px;
      background: #20242e; color: var(--muted);
    }
    .pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .pill.ok { color: var(--ok); }
    .pill.warn { color: var(--warn); }
    .pill.err { color: var(--err); }

    /* info */
    .info { margin-bottom: 12px; }
    .info div { color: var(--muted); font-size: 11px; padding: 2px 0; }
    .info b { color: var(--text); font-weight: 500; }

    /* queue state */
    .queue {
      background: var(--card); border: 1px solid var(--line); border-radius: 10px;
      padding: 12px; margin-bottom: 10px;
    }
    #queueInfo { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
    #queueInfo.armed { color: var(--accent); font-weight: 600; }
    #queueInfo.busy { color: var(--warn); font-weight: 600; }

    button {
      width: 100%; padding: 9px 10px; border-radius: 9px; border: none;
      font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
      background: var(--accent); color: #fff;
    }
    button:disabled { background: #232833; color: #5f6674; cursor: default; }
    button.ghost { background: transparent; border: 1px solid var(--line); color: var(--muted); font-weight: 500; }
    button.ghost:hover { color: var(--text); }

    /* auto switch */
    .switch { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; }
    .switch span { color: var(--muted); font-size: 11px; }
    .switch input { width: auto; margin: 0; }

    /* advanced */
    details { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
    summary { color: var(--muted); font-size: 11px; cursor: pointer; list-style: none; }
    summary::-webkit-details-marker { display: none; }
    summary::before { content: "▸ "; }
    details[open] summary::before { content: "▾ "; }
    label.field { display: block; color: var(--muted); font-size: 11px; margin: 10px 0 5px; }
    input[type="password"] {
      width: 100%; padding: 7px 9px; border-radius: 8px; font-family: inherit; font-size: 11px;
      border: 1px solid var(--line); background: #0e1015; color: var(--text);
    }

    /* log */
    .loghead { display: flex; justify-content: space-between; margin: 14px 0 6px; }
    .loghead span { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.6px; }
    pre {
      margin: 0; padding: 9px 10px; border-radius: 9px; background: #0e1015;
      border: 1px solid var(--line); color: #98a2b3; font-size: 10px; line-height: 1.5;
      max-height: 132px; overflow: auto; white-space: pre-wrap; word-break: break-word;
    }
    .foot { color: #5f6674; font-size: 10px; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="head">
    <div class="title">Design Bridge</div>
    <div id="wsStatus" class="pill warn">Offline</div>
  </div>

  <div class="info">
    <div id="docStatus">Document: <b>–</b></div>
    <div id="selStatus">Selection: <b>–</b></div>
  </div>

  <div class="queue">
    <div id="queueInfo">Idle</div>
    <button id="execBtn" disabled>Apply</button>
    <div class="switch">
      <span>Apply automatically</span>
      <input id="autoChk" type="checkbox" checked />
    </div>
  </div>

  <details>
    <summary>Connection</summary>
    <label class="field" for="token">Bridge token</label>
    <input id="token" type="password" placeholder="xdbr-…" />
    <button id="connectBtn" class="ghost" style="margin-top:10px;">Connect</button>
    <button id="refreshBtn" class="ghost" style="margin-top:8px;">Refresh document</button>
  </details>

  <div class="loghead"><span>Activity</span><span id="logHint">idle</span></div>
  <pre id="log">–</pre>

  <div class="foot">Local only. Edits run inside Adobe XD's own edit context.</div>

  <script src="ops.js"></script>
  <script src="executor.js"></script>
  <script src="main.js"></script>
</body>
</html>
